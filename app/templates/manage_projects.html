{% extends "base.html" %}
{% block content %}
<div class="max-w-6xl mx-auto py-8">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-2xl font-bold text-white">Project Management</h1>
        <div class="flex gap-4">
            <a href="{{ url_for('admin.admin_dashboard') }}" class="text-emerald-400">← Back</a>
            
            <a href="{{ url_for('admin.add_project') }}" 
               onclick="document.getElementById('projectForm').classList.toggle('hidden'); return true;" 
               class="text-emerald-400 hover:text-emerald-300 font-bold">
               + Add Project
            </a>
        </div>
    </div>

    <div id="projectForm" class="hidden mb-8 bg-slate-900 border border-slate-800 p-6 rounded-xl">
        </div>

    <div class="bg-slate-900/50 border border-slate-800 rounded-xl overflow-hidden">
        <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-950 text-slate-400 uppercase text-xs">
                <tr>
                    <th class="px-6 py-4">Title</th>
                    <th class="px-6 py-4">Budget</th>
                    <th class="px-6 py-4 text-center">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-800">
                {% for project in projects %}
                <tr>
                    <td class="px-6 py-4 text-white font-medium">{{ project.title }}</td>
                    <td class="px-6 py-4 text-emerald-400">K{{ "{:,.2f}".format(project.budget) }}</td>
                    <td class="px-6 py-4 text-center flex justify-center gap-4">
                        <a href="{{ url_for('admin.edit_project', project_id=project.id) }}" class="text-sky-400 hover:text-sky-300 text-xs">Edit</a>
                        <form action="{{ url_for('admin.delete_project', project_id=project.id) }}" method="POST">
                            <button type="submit" class="text-rose-400 hover:text-rose-300 text-xs">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
