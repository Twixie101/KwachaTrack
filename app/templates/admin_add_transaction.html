{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto mt-10 p-6 bg-slate-900/40 border border-slate-800 rounded-xl">
    <h2 class="text-white text-xl font-bold mb-6">Log New Financial Transaction</h2>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs text-slate-400 mb-1">Select Project</label>
            <select name="project_id" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-sm">
                {% for p in projects %}
                <option value="{{ p.id }}">{{ p.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Date</label>
                <input type="date" name="date" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-sm">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Amount (ZMW)</label>
                <input type="number" step="0.01" name="amount" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-sm">
            </div>
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Recipient</label>
            <input type="text" name="recipient" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-sm">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Description</label>
            <input type="text" name="description" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-sm">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">Reference Number</label>
            <input type="text" name="ref" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white text-sm">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg mt-4 transition-all">
            Submit Transaction
        </button>
    </form>
</div>
{% endblock %}
