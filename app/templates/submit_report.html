{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto py-10 px-4">
    <form method="POST" enctype="multipart/form-data" class="bg-slate-900 border border-slate-800 rounded-xl p-8 space-y-6">
        <h2 class="text-xl font-bold text-white">Report Infrastructure Incident</h2>
        
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Description</label>
            <textarea name="description" rows="4" required 
                class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:ring-1 focus:ring-emerald-500 outline-none"
                placeholder="Describe the issue..."></textarea>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Upload Evidence (Photos)</label>
            <input type="file" name="evidence" accept="image/*" 
                class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-500/10 file:text-emerald-400 hover:file:bg-emerald-500/20">
        </div>

        <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-emerald-500 transition-all">
            Submit Report
        </button>
    </form>
</div>
{% endblock %}
