{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto py-8">
    <h1 class="text-2xl font-bold text-white mb-6">Edit Project</h1>
    <form method="POST" class="bg-slate-900 p-6 rounded-xl border border-slate-800">
        
        <div class="mb-4">
            <label class="block text-slate-400 text-xs mb-1">Project Title</label>
            <input type="text" name="title" value="{{ project.title }}" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-white" required>
        </div>

        <div class="mb-4">
            <label class="block text-slate-400 text-xs mb-1">Contractor Name</label>
            <input type="text" name="contractor_name" value="{{ project.contractor_name or '' }}" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-white" required>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-slate-400 text-xs mb-1">Budget (ZMW)</label>
                <input type="number" step="0.01" name="budget" value="{{ project.budget }}" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-white" required>
            </div>
            <div>
                <label class="block text-slate-400 text-xs mb-1">Expended Amount (ZMW)</label>
                <input type="number" step="0.01" name="expended_amount" value="{{ project.expended_amount or 0.0 }}" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-white" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-slate-400 text-xs mb-1">Progress Percentage (%)</label>
            <input type="number" min="0" max="100" name="progress_percentage" value="{{ project.progress_percentage or 0 }}" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-white" required>
        </div>

        <div class="mb-6">
            <label class="block text-slate-400 text-xs mb-1">Description</label>
            <textarea name="description" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-white h-32">{{ project.description }}</textarea>
        </div>

        <div class="flex justify-end gap-2">
            <a href="{{ url_for('admin.manage_projects') }}" class="text-slate-400 px-4 py-2">Cancel</a>
            <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded font-bold hover:bg-emerald-500">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
